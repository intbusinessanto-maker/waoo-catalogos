name: Actualizar portadas y manifest

on:
  push:
    branches: [main]
    paths:
      - "coleccion/**"
      - "promociones/**"
      - "precios/**"
      - "scripts/**"
      - ".github/workflows/manifest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manifest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Generar portadas y manifest.json
        run: python3 scripts/build_manifest.py
      - name: Guardar cambios
        run: |
          git config user.name "waoo-bot"
          git config user.email "waoo-bot@users.noreply.github.com"
          git add -A manifest.json portadas
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar portadas y manifest [automático]"
            git push
          fi
